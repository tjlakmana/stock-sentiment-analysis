# Alembic configuration for sentiment_analysis
# Run migrations from the project root:
#   alembic -c sentiment_analysis/storage/alembic/alembic.ini upgrade head

[alembic]
# Path to the migration scripts directory (relative to this file)
script_location = .

# Filename template for auto-generated migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Project root on sys.path so env.py imports resolve (env.py also sets this)
prepend_sys_path = ../../..

version_path_separator = os

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
