# Alembic configuration for sentiment_analysis
# Run migrations from the sentiment_analysis/ directory:
#   cd sentiment_analysis
#   alembic upgrade head

[alembic]
# Path to the migration scripts directory (relative to this file)
script_location = storage/alembic

# Filename template for auto-generated migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Add this directory to sys.path so that model imports work
prepend_sys_path = .

version_path_separator = os

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
